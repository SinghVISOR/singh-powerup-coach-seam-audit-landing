<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMB.AI Beta: AI operations for small-business owners | The SEAMline Method</title>
<meta name="description" content="SMB.AI is a free beta: 12 Claude specialists for small-business owners, plus the AI-Operations Playbook, Prompting Toolkit and Skill Builder. Built on the HUMAN Framework. You approve every send." />
<meta property="og:title" content="SMB.AI Beta: 12 AI specialists. You approve every send." />
<meta property="og:description" content="Free beta for small-business owners. Invoice chasing, inbox triage, quotes, reviews, cash flow and SOPs, set up inside Claude in an afternoon." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#0F1E3D;--navy-80:#2B3A5A;--navy-60:#5A6580;--rust:#B8512A;--bone:#F5F1EB;--bone-deep:#ECE6DC;--rule:rgba(15,30,61,.14);
    --serif:"Source Serif 4",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--max:1180px;--gutter:clamp(16px,4vw,40px)}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bone);color:var(--navy);font-family:var(--sans);display:flex;flex-direction:column;height:100vh;-webkit-font-smoothing:antialiased}
  header.site{flex:0 0 auto;background:rgba(245,241,235,.96);border-bottom:1px solid var(--rule)}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
  .brandrow{display:flex;align-items:center;gap:14px;min-width:0}
  .brandmark{display:inline-flex;flex-direction:column;line-height:1;text-decoration:none}
  .wordmark{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.5px;color:var(--navy)}
  .wordmark .caps{letter-spacing:1.2px}.wordmark .tail{font-style:italic;font-weight:400;letter-spacing:0}
  .seamline{margin-top:4px;height:2px;width:100%;background:linear-gradient(to right,var(--navy) 0%,var(--navy) 78%,var(--rust) 78%,var(--rust) 100%)}
  .product{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--navy);white-space:nowrap}.product .d{color:var(--rust)}
  .divider{width:1px;height:26px;background:var(--rule)}
  .beta{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--rust);border:1px solid var(--rust);border-radius:20px;padding:3px 9px;white-space:nowrap}
  .cta{font-size:13px;font-weight:600;text-decoration:none;padding:8px 14px;background:var(--navy);color:var(--bone);border-radius:2px;white-space:nowrap}
  .cta:hover{background:var(--rust)}
  .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{border:0;background:transparent;cursor:pointer;text-align:left;padding:8px 14px 9px;border-bottom:2px solid transparent;font-family:var(--sans);display:flex;flex-direction:column;gap:1px;white-space:nowrap}
  .tab:hover{background:var(--bone-deep)}
  .tab .l{font-size:13.5px;font-weight:600;color:var(--navy-60)}.tab .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--navy-60);opacity:.75}
  .tab[aria-selected="true"]{border-bottom-color:var(--rust)}.tab[aria-selected="true"] .l{color:var(--navy)}
  .frame{flex:1 1 auto;min-height:0}#v{width:100%;height:100%;border:0;display:block;background:var(--bone)}
  @media(max-width:640px){.divider,.wordmark-wrap{display:none}.tab .s{display:none}.cta{padding:7px 10px;font-size:12px}}
</style>
</head>
<body>
<header class="site">
  <div class="wrap top">
    <div class="brandrow">
      <a href="/" class="brandmark wordmark-wrap" aria-label="The SEAMline Method home"><span class="wordmark"><span class="caps">SEAM</span><span class="tail">line</span></span><span class="seamline" aria-hidden="true"></span></a>
      <span class="divider" aria-hidden="true"></span>
      <span class="product">SMB<span class="d">.</span>AI</span>
      <span class="beta">Free beta</span>
    </div>
    <a class="cta" href="/smb-ai/download/SMB-AI-Bench-beta.zip" download>Download the Bench</a>
  </div>
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="SMB.AI sections">
      <button class="tab" role="tab" data-doc="bench" data-src="bench.html"><span class="l">The Bench</span><span class="s">12 specialists · free</span></button>
      <button class="tab" role="tab" data-doc="playbook" data-src="owners-playbook.html"><span class="l">Owner's Playbook</span><span class="s">Start here</span></button>
      <button class="tab" role="tab" data-doc="toolkit" data-src="prompting-toolkit.html"><span class="l">Prompting Toolkit</span><span class="s">Frameworks</span></button>
      <button class="tab" role="tab" data-doc="skills" data-src="skill-builder.html"><span class="l">Skill Builder</span><span class="s">Go further</span></button>
    </div>
  </div>
</header>
<div class="frame"><iframe id="v" title="SMB.AI"></iframe></div>
<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab')), v=document.getElementById('v');
  function show(key, push){
    var t=tabs.filter(function(b){return b.dataset.doc===key})[0]||tabs[0];
    tabs.forEach(function(b){b.setAttribute('aria-selected', b===t ? 'true':'false')});
    if(v.getAttribute('src')!==t.dataset.src) v.setAttribute('src', t.dataset.src);
    document.title=t.querySelector('.l').textContent+' · SMB.AI Beta | The SEAMline Method';
    if(push && location.hash!=='#'+t.dataset.doc) history.replaceState(null,'','#'+t.dataset.doc);
  }
  tabs.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.doc,true)})});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1),false)});
  show(location.hash.slice(1)||'bench',false);
})();
</script>
</body>
</html>
